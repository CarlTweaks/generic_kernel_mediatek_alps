name: Build Infinix Pentest Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Compilers and Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev libelf-dev bison flex kmod gcc-aarch64-linux-gnu clang lld

    - name: Compile Kernel and Modules
      run: |
        export MAKE_FLAGS="ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang LD=ld.lld"
        
        # Gagamitin na natin ang generic 'defconfig' na pinalitan mo ang laman
        make O=out $MAKE_FLAGS defconfig
        
        make O=out $MAKE_FLAGS olddefconfig
        make O=out $MAKE_FLAGS -j$(nproc)

    - name: Upload Finished Kernel and Modules
      uses: actions/upload-artifact@v4
      with:
        name: Finished-Infinix-Kernel
        path: |
          out/arch/arm64/boot/Image.gz-dtb
          out/drivers/bluetooth/hci_vhci.ko
