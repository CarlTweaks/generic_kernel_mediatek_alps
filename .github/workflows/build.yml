name: Build Kernel Hot 11 Play
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04 # Pinaka-stable para sa 4.19 kernels
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libncurses5-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # Hindi na natin kailangan ang make clean
          make k65v1_64_bsp_defconfig
          # KCFLAGS="-w" para i-ignore ang lahat ng warnings na nagpapatigil sa build
          make -j$(nproc) KCFLAGS="-w" 

      - name: Check for Image
        run: |
          if [ -f arch/arm64/boot/Image.gz ]; then
            echo "Kernel built successfully!"
          else
            echo "Kernel build failed!"
            exit 1
          fi

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Hot11Play-Kernel
          path: arch/arm64/boot/Image.gz
          
