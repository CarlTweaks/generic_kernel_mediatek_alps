name: Build Kernel Hot 11 Play
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libncurses5-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # I-setup ang configuration gamit ang nakita nating config file
          make k65v1_64_bsp_defconfig
          
          # Compilation Proper:
          # -j$(nproc): Gamitin lahat ng CPU cores para mabilis
          # KCFLAGS, HOSTCFLAGS: Pinipilit ang compiler na i-ignore ang errors/warnings
          make -j$(nproc) KCFLAGS="-w -fpermissive" HOSTCFLAGS="-w" HOSTCXXFLAGS="-w"

      - name: Check for Image
        run: |
          if [ -f arch/arm64/boot/Image.gz ]; then
            echo "Kernel built successfully!"
          else
            echo "Kernel build failed! Image.gz not found."
            exit 1
          fi

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Hot11Play-Kernel-Image
          path: arch/arm64/boot/Image.gz
          
