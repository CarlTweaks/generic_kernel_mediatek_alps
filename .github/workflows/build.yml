name: Build Kernel Hot 11 Play
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04 # Mas stable ang older ubuntu para sa older kernels
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libncurses5-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # Clean muna para sigurado
          make clean
          # Dito natin gagamitin ang nakita mong config
          make k65v1_64_bsp_defconfig
          # Simulan ang luto!
          make -j$(nproc) KCFLAGS="-w"

      - name: Check for Image
        run: |
          if [ -f arch/arm64/boot/Image.gz ]; then
            echo "Kernel built successfully!"
          else
            echo "Kernel build failed!"
            exit 1
          fi

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v3
        with:
          name: Hot11Play-Kernel
          path: arch/arm64/boot/Image.gz
          
